# One mutation per behaviour of `src/lib/LibLeakyBucket.sol`, after the port from
# uint256 fixed point to Rain Floats.
#
# Targets are in `src/` only. A target in a test would co-mutate the oracle and
# void the verdict.

[suite]
root = "."
command = ["bash", ".mutation-test/check.sh"]
# forge's own tally. `--force` in the wrapper means the mutated source is always
# recompiled, so a verdict is never scored against a stale artifact.
proof = '(\d+) tests passed, (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (\S+)'
timeout-secs = 1800

# --- the saturating sub itself, which is what the old `LibSaturatingMath` call
# became. Both mutants here are behaviours of the helper, so they reach all
# three of its call sites at once. ---

[[mutants]]
name = "M01 the saturation takes the smaller, so a negative result is kept"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.min(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"

[[mutants]]
name = "M02 the saturating sub adds instead of subtracting"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.max(a.add(b), LibDecimalFloat.FLOAT_ZERO);"

# --- the leak ---

[[mutants]]
name = "M03 the leak is measured backwards, so the level is the thing leaked from"
file = "src/lib/LibLeakyBucket.sol"
target = "saturatingSub(bucket.level, elapsed.mul(bucket.leakRate))"
replacement = "saturatingSub(elapsed.mul(bucket.leakRate), bucket.level)"

[[mutants]]
name = "M04 the leak ignores the rate, leaking one unit per unit of time"
file = "src/lib/LibLeakyBucket.sol"
target = "saturatingSub(bucket.level, elapsed.mul(bucket.leakRate))"
replacement = "saturatingSub(bucket.level, elapsed)"

[[mutants]]
name = "M05 elapsed does not saturate, so a backwards clock credits negative leak"
file = "src/lib/LibLeakyBucket.sol"
target = "Float elapsed = saturatingSub(timestamp, bucket.timestamp);"
replacement = "Float elapsed = timestamp.sub(bucket.timestamp);"

[[mutants]]
name = "M06 elapsed is measured backwards"
file = "src/lib/LibLeakyBucket.sol"
target = "Float elapsed = saturatingSub(timestamp, bucket.timestamp);"
replacement = "Float elapsed = saturatingSub(bucket.timestamp, timestamp);"

# --- the headroom ---

[[mutants]]
name = "M07 headroom is measured from the level instead of the capacity"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return saturatingSub(levelNow, capacity);"

[[mutants]]
name = "M08 headroom does not saturate, so an over-capacity bucket offers negative"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return capacity.sub(levelNow);"
# --- the fillable domain ---

[[mutants]]
name = "M09 a negative capacity is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (capacity.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (capacity.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M10 a negative leak rate is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (leakRate.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (leakRate.gt(LibDecimalFloat.FLOAT_ZERO)) {"

# --- the amount guards ---

[[mutants]]
name = "M11 a zero amount is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.isZero()) {"
replacement = "if (false) {"

[[mutants]]
name = "M12 a negative amount is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (amount.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M13 an amount exactly at the headroom is refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.gt(headroomFrom(bucket.capacity, levelNow))) {"
replacement = "if (amount.gte(headroomFrom(bucket.capacity, levelNow))) {"

[[mutants]]
name = "M14 the fill does not add the amount to the level"
file = "src/lib/LibLeakyBucket.sol"
target = """            revert LeakyBucketAmountNotCredited(levelNow, amount);
        }"""
replacement = """            revert LeakyBucketAmountNotCredited(levelNow, amount);
        }
        level = levelNow;"""

# --- the checkpoint ---

[[mutants]]
name = "M15 the checkpoint takes the earlier time, re-crediting leak on the next fill"
file = "src/lib/LibLeakyBucket.sol"
target = "LibDecimalFloat.max(timestamp, bucket.timestamp)"
replacement = "LibDecimalFloat.min(timestamp, bucket.timestamp)"

# --- settle is the one place the domain check and the leak meet. Each mutant
# here has one entry point go round it to the unchecked leak. ---

[[mutants]]
name = "M16 headroomAt goes round settle and answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = "return headroomFrom(bucket.capacity, levelAt(bucket, timestamp));"
replacement = """(Float level,) = leak(bucket, timestamp);
        return headroomFrom(bucket.capacity, level);"""

[[mutants]]
name = "M17 settle does not check the domain"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return leak(bucket, timestamp);"""
replacement = """        return leak(bucket, timestamp);"""

[[mutants]]
name = "M18 fill goes round settle and fills a bucket outside the domain"
file = "src/lib/LibLeakyBucket.sol"
target = "(levelNow, checkpoint) = settle(bucket, timestamp);"
replacement = "(levelNow, checkpoint) = leak(bucket, timestamp);"

[[mutants]]
name = "M19 an amount too small to be recorded is accepted and charges nothing"
file = "src/lib/LibLeakyBucket.sol"
target = "if (!level.gt(levelNow)) {"
replacement = "if (false) {"

# --- the negative level and timestamps (#115). Each drops one check, so only a
# test that hands over that negative kills it. ---

[[mutants]]
name = "M20 a negative stored level is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.level.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M21 a negative stored timestamp is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M22 a negative timestamp to read or fill at is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

# --- levelAt and the leak ---

[[mutants]]
name = "M23 levelAt goes round settle and answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = "(Float level,) = settle(bucket, timestamp);"
replacement = "(Float level,) = leak(bucket, timestamp);"

[[mutants]]
name = "M24 the leak takes nothing off the stored level"
file = "src/lib/LibLeakyBucket.sol"
target = "saturatingSub(bucket.level, elapsed.mul(bucket.leakRate))"
replacement = "saturatingSub(bucket.level, elapsed.mul(LibDecimalFloat.FLOAT_ZERO))"

[[mutants]]
name = "M25 a write at a backwards clock moves the checkpoint back"
file = "src/lib/LibLeakyBucket.sol"
target = "LibDecimalFloat.max(timestamp, bucket.timestamp)"
replacement = "timestamp"

[[mutants]]
name = "M26 settle settles nothing, so a rate change re-rates the whole interval"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return leak(bucket, timestamp);"""
replacement = """        checkFillableDomain(bucket, timestamp);
        return (bucket.level, bucket.timestamp);"""

# --- the policy check, which the domain check is written in terms of ---

[[mutants]]
name = "M27 the domain check does not check the policy"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkPolicy(bucket.capacity, bucket.leakRate);
        if (bucket.level.lt(LibDecimalFloat.FLOAT_ZERO)) {"""
replacement = """        if (bucket.level.lt(LibDecimalFloat.FLOAT_ZERO)) {"""

# --- setPolicy ---

[[mutants]]
name = "M28 setPolicy does not check the policy it is given"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkPolicy(capacity, leakRate);
        (Float level, Float checkpoint) = settle(bucket, timestamp);"""
replacement = """        (Float level, Float checkpoint) = settle(bucket, timestamp);"""

[[mutants]]
name = "M29 setPolicy settles at the new rate, re-rating the whole interval"
file = "src/lib/LibLeakyBucket.sol"
target = "(Float level, Float checkpoint) = settle(bucket, timestamp);"
replacement = """bucket.leakRate = leakRate;
        (Float level, Float checkpoint) = settle(bucket, timestamp);"""

[[mutants]]
name = "M30 setPolicy settles nothing"
file = "src/lib/LibLeakyBucket.sol"
target = "(Float level, Float checkpoint) = settle(bucket, timestamp);"
replacement = "(Float level, Float checkpoint) = (bucket.level, bucket.timestamp);"

[[mutants]]
name = "M31 setPolicy returns the stored rate instead of the new one"
file = "src/lib/LibLeakyBucket.sol"
target = "capacity: capacity, leakRate: leakRate});"
replacement = "capacity: capacity, leakRate: bucket.leakRate});"

[[mutants]]
name = "M32 setPolicy returns the stored capacity instead of the new one"
file = "src/lib/LibLeakyBucket.sol"
target = "capacity: capacity, leakRate: leakRate});"
replacement = "capacity: bucket.capacity, leakRate: leakRate});"

[[mutants]]
name = "M33 setPolicy goes round settle and takes a bucket outside the domain"
file = "src/lib/LibLeakyBucket.sol"
target = "(Float level, Float checkpoint) = settle(bucket, timestamp);"
replacement = "(Float level, Float checkpoint) = leak(bucket, timestamp);"

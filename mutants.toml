# One mutation per behaviour of `src/lib/LibLeakyBucket.sol`, after the port from
# uint256 fixed point to Rain Floats.
#
# Targets are in `src/` only. A target in a test would co-mutate the oracle and
# void the verdict.

[suite]
root = "."
command = ["sh", ".mutation-test/check.sh"]
# forge's own tally. `--force` in the wrapper means the mutated source is always
# recompiled, so a verdict is never scored against a stale artifact.
proof = '(\d+) tests passed, (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (\S+)'
timeout-secs = 1800

# --- the saturating sub itself, which is what the old `LibSaturatingMath` call
# became. Both mutants here are behaviours of the helper, so they reach all
# three of its call sites at once. ---

[[mutants]]
name = "M01 the saturation takes the smaller, so a negative result is kept"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.min(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"

[[mutants]]
name = "M02 the saturating sub adds instead of subtracting"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.max(a.add(b), LibDecimalFloat.FLOAT_ZERO);"

# --- the leak ---

[[mutants]]
name = "M03 the leak is measured backwards, so the level is the thing leaked from"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(level, elapsed.mul(leakRate));"
replacement = "return saturatingSub(elapsed.mul(leakRate), level);"

[[mutants]]
name = "M04 the leak ignores the rate, leaking one unit per unit of time"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(level, elapsed.mul(leakRate));"
replacement = "return saturatingSub(level, elapsed);"

[[mutants]]
name = "M05 elapsed does not saturate, so a backwards clock credits negative leak"
file = "src/lib/LibLeakyBucket.sol"
target = "return leak(level, saturatingSub(timestamp, checkpoint), leakRate);"
replacement = "return leak(level, timestamp.sub(checkpoint), leakRate);"

[[mutants]]
name = "M06 elapsed is measured backwards"
file = "src/lib/LibLeakyBucket.sol"
target = "return leak(level, saturatingSub(timestamp, checkpoint), leakRate);"
replacement = "return leak(level, saturatingSub(checkpoint, timestamp), leakRate);"

# --- the headroom ---

[[mutants]]
name = "M07 headroom is measured from the level instead of the capacity"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return saturatingSub(levelNow, capacity);"

[[mutants]]
name = "M08 headroom does not saturate, so an over-capacity bucket offers negative"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return capacity.sub(levelNow);"
# --- the fillable domain ---

[[mutants]]
name = "M09 a negative capacity is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.capacity.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (bucket.capacity.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M10 a negative leak rate is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.leakRate.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (bucket.leakRate.gt(LibDecimalFloat.FLOAT_ZERO)) {"

# --- the amount guards ---

[[mutants]]
name = "M11 a zero amount is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.isZero()) {"
replacement = "if (false) {"

[[mutants]]
name = "M12 a negative amount is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (amount.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M13 an amount exactly at the headroom is refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.gt(headroom)) {"
replacement = "if (amount.gte(headroom)) {"

[[mutants]]
name = "M14 the fill does not add the amount to the level"
file = "src/lib/LibLeakyBucket.sol"
target = "        return filled;"
replacement = "        return levelNow;"

# --- the checkpoint ---

[[mutants]]
name = "M15 the checkpoint takes the earlier time, re-crediting leak on the next fill"
file = "src/lib/LibLeakyBucket.sol"
target = "checkpoint = LibDecimalFloat.max(timestamp, bucket.timestamp);"
replacement = "checkpoint = LibDecimalFloat.min(timestamp, bucket.timestamp);"

# --- the domain check on each entry point, so a read cannot answer where a fill
# refuses. Each target carries its own function's following line, because the
# call itself appears three times. ---

[[mutants]]
name = "M16 headroomAt answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return headroomFrom("""
replacement = """        return headroomFrom("""

[[mutants]]
name = "M17 levelAt answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return levelAt(bucket.level"""
replacement = """        return levelAt(bucket.level"""

[[mutants]]
name = "M18 fill does not check the domain before filling"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        level = fillAt("""
replacement = """        level = fillAt("""

[[mutants]]
name = "M19 an amount too small to be recorded is accepted and charges nothing"
file = "src/lib/LibLeakyBucket.sol"
target = "if (!filled.gt(levelNow)) {"
replacement = "if (false) {"

# --- the negative level and timestamps (#115). Each drops one check, so only a
# test that hands over that negative kills it. ---

[[mutants]]
name = "M20 a negative stored level is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.level.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M21 a negative stored timestamp is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M22 a negative timestamp to read or fill at is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

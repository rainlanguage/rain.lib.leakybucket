# One mutation per behaviour of `src/lib/LibLeakyBucket.sol`, after the port from
# uint256 fixed point to Rain Floats.
#
# Targets are in `src/` only. A target in a test would co-mutate the oracle and
# void the verdict.

[suite]
root = "."
command = ["bash", ".mutation-test/check.sh"]
# forge's own tally. `--force` in the wrapper means the mutated source is always
# recompiled, so a verdict is never scored against a stale artifact.
proof = '(\d+) tests passed, (\d+) failed'
fail-pattern = '\[FAIL[^\]]*\] (\S+)'
timeout-secs = 1800

# --- the saturating sub itself, which is what the old `LibSaturatingMath` call
# became. Both mutants here are behaviours of the helper, so they reach both of
# its call sites at once. ---

[[mutants]]
name = "M01 the saturation takes the smaller, so a negative result is kept"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.min(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"

[[mutants]]
name = "M02 the saturating sub adds instead of subtracting"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(a.sub(b), LibDecimalFloat.FLOAT_ZERO);"
replacement = "return LibDecimalFloat.max(a.add(b), LibDecimalFloat.FLOAT_ZERO);"

# --- the leak ---

[[mutants]]
name = "M03 the leak is measured backwards, so the level is the thing leaked from"
file = "src/lib/LibLeakyBucket.sol"
target = "LibDecimalFloatImplementation.sub(levelCoefficient, levelExponent, leakCoefficient, leakExponent);"
replacement = "LibDecimalFloatImplementation.sub(leakCoefficient, leakExponent, levelCoefficient, levelExponent);"

[[mutants]]
name = "M04 the leak ignores the rate, leaking one unit per unit of time"
file = "src/lib/LibLeakyBucket.sol"
target = "LibDecimalFloatImplementation.mul(elapsedCoefficient, elapsedExponent, rateCoefficient, rateExponent);"
replacement = "(elapsedCoefficient, elapsedExponent);"

[[mutants]]
name = "M05 elapsed does not saturate, so a backwards clock credits negative leak"
file = "src/lib/LibLeakyBucket.sol"
target = "saturatingSub(timestamp, bucket.timestamp).unpack();"
replacement = "timestamp.sub(bucket.timestamp).unpack();"

[[mutants]]
name = "M06 elapsed is measured backwards"
file = "src/lib/LibLeakyBucket.sol"
target = "saturatingSub(timestamp, bucket.timestamp).unpack();"
replacement = "saturatingSub(bucket.timestamp, timestamp).unpack();"

# --- the headroom ---

[[mutants]]
name = "M07 headroom is measured from the level instead of the capacity"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return saturatingSub(levelNow, capacity);"

[[mutants]]
name = "M08 headroom does not saturate, so an over-capacity bucket offers negative"
file = "src/lib/LibLeakyBucket.sol"
target = "return saturatingSub(capacity, levelNow);"
replacement = "return capacity.sub(levelNow);"
# --- the fillable domain ---

[[mutants]]
name = "M09 a negative capacity is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (capacity.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (capacity.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M10 a negative leak rate is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (leakRate.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (leakRate.gt(LibDecimalFloat.FLOAT_ZERO)) {"

# --- the amount guards ---

[[mutants]]
name = "M11 a zero amount is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.isZero()) {"
replacement = "if (false) {"

[[mutants]]
name = "M12 a negative amount is accepted and a positive one refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (amount.gt(LibDecimalFloat.FLOAT_ZERO)) {"

[[mutants]]
name = "M13 an amount exactly at the headroom is refused"
file = "src/lib/LibLeakyBucket.sol"
target = "if (amount.gt(headroomFrom(bucket.capacity, levelNow))) {"
replacement = "if (amount.gte(headroomFrom(bucket.capacity, levelNow))) {"

[[mutants]]
name = "M14 the fill does not add the amount to the level"
file = "src/lib/LibLeakyBucket.sol"
target = """            revert LeakyBucketAmountNotCredited(levelNow, amount);
        }"""
replacement = """            revert LeakyBucketAmountNotCredited(levelNow, amount);
        }
        level = levelNow;"""

# --- the checkpoint ---

[[mutants]]
name = "M15 the checkpoint takes the earlier time, re-crediting leak on the next fill"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(timestamp, bucket.timestamp);"
replacement = "return LibDecimalFloat.min(timestamp, bucket.timestamp);"

# --- each entry point checks the domain itself and then reaches the one
# unchecked leak. Each mutant here has one entry point reach the leak without
# its check. ---

[[mutants]]
name = "M16 headroomAt answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = "return headroomFrom(bucket.capacity, levelAt(bucket, timestamp));"
replacement = "return headroomFrom(bucket.capacity, leakedLevel(bucket, timestamp));"

[[mutants]]
name = "M17 settle answers on a bucket fill would refuse"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return (leakedLevel(bucket, timestamp), checkpointAt(bucket, timestamp));"""
replacement = """        return (leakedLevel(bucket, timestamp), checkpointAt(bucket, timestamp));"""

[[mutants]]
name = "M18 fill does not check the domain before it looks at the amount"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        if (amount.isZero()) {"""
replacement = """        if (amount.isZero()) {"""

[[mutants]]
name = "M19 an amount too small to be recorded is accepted and charges nothing"
file = "src/lib/LibLeakyBucket.sol"
target = "if (!level.gt(levelNow)) {"
replacement = "if (false) {"

# --- the negative level and timestamps (#115). Each drops one check, so only a
# test that hands over that negative kills it. ---

[[mutants]]
name = "M20 a negative stored level is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.level.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M21 a negative stored timestamp is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (bucket.timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

[[mutants]]
name = "M22 a negative timestamp to read or fill at is accepted"
file = "src/lib/LibLeakyBucket.sol"
target = "if (timestamp.lt(LibDecimalFloat.FLOAT_ZERO)) {"
replacement = "if (false) {"

# --- levelAt, and settle beside it ---

[[mutants]]
name = "M23 levelAt does not check the domain"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return leakedLevel(bucket, timestamp);"""
replacement = """        return leakedLevel(bucket, timestamp);"""

[[mutants]]
name = "M24 the leak takes nothing off the stored level"
file = "src/lib/LibLeakyBucket.sol"
target = "LibDecimalFloatImplementation.mul(elapsedCoefficient, elapsedExponent, rateCoefficient, rateExponent);"
replacement = "LibDecimalFloatImplementation.mul(elapsedCoefficient, elapsedExponent, 0, rateExponent);"

[[mutants]]
name = "M25 a write at a backwards clock moves the checkpoint back"
file = "src/lib/LibLeakyBucket.sol"
target = "return LibDecimalFloat.max(timestamp, bucket.timestamp);"
replacement = "return timestamp;"

[[mutants]]
name = "M26 settle settles nothing, so a rate change re-rates the whole interval"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkFillableDomain(bucket, timestamp);
        return (leakedLevel(bucket, timestamp), checkpointAt(bucket, timestamp));"""
replacement = """        checkFillableDomain(bucket, timestamp);
        return (bucket.level, bucket.timestamp);"""

# --- fill checks the bucket, then the amount, then leaks ---

[[mutants]]
name = "M27 fill leaks before it looks at the amount"
file = "src/lib/LibLeakyBucket.sol"
target = """        if (amount.isZero()) {
            revert LeakyBucketZeroAmount();
        }
        if (amount.lt(LibDecimalFloat.FLOAT_ZERO)) {
            revert LeakyBucketNegativeAmount(amount);
        }
        Float levelNow = leakedLevel(bucket, timestamp);"""
replacement = """        Float levelNow = leakedLevel(bucket, timestamp);
        if (amount.isZero()) {
            revert LeakyBucketZeroAmount();
        }
        if (amount.lt(LibDecimalFloat.FLOAT_ZERO)) {
            revert LeakyBucketNegativeAmount(amount);
        }"""

# --- the policy check, which the domain check is written in terms of ---

[[mutants]]
name = "M28 the domain check does not check the policy"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkPolicy(bucket.capacity, bucket.leakRate);
        checkLevelAndTimestamps(bucket, timestamp);"""
replacement = """        checkLevelAndTimestamps(bucket, timestamp);"""

# --- setPolicy ---

[[mutants]]
name = "M29 setPolicy does not check the policy it is given"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkPolicy(capacity, leakRate);
        checkLevelAndTimestamps(bucket, timestamp);"""
replacement = """        checkLevelAndTimestamps(bucket, timestamp);"""

[[mutants]]
name = "M30 setPolicy settles at a stored negative rate, raising the level"
file = "src/lib/LibLeakyBucket.sol"
target = "Float level = bucket.leakRate.lt(LibDecimalFloat.FLOAT_ZERO) ? bucket.level : leakedLevel(bucket, timestamp);"
replacement = "Float level = leakedLevel(bucket, timestamp);"

[[mutants]]
name = "M31 setPolicy settles at the new rate, re-rating the whole interval"
file = "src/lib/LibLeakyBucket.sol"
target = "Float level = bucket.leakRate.lt(LibDecimalFloat.FLOAT_ZERO) ? bucket.level : leakedLevel(bucket, timestamp);"
replacement = "Float level = leakedLevel(LeakyBucket(bucket.level, bucket.timestamp, capacity, leakRate), timestamp);"

[[mutants]]
name = "M32 setPolicy checks the bucket and settles nothing"
file = "src/lib/LibLeakyBucket.sol"
target = "Float level = bucket.leakRate.lt(LibDecimalFloat.FLOAT_ZERO) ? bucket.level : leakedLevel(bucket, timestamp);"
replacement = "Float level = bucket.level;"

[[mutants]]
name = "M33 setPolicy returns the stored rate instead of the new one"
file = "src/lib/LibLeakyBucket.sol"
target = "capacity: capacity, leakRate: leakRate"
replacement = "capacity: capacity, leakRate: bucket.leakRate"

[[mutants]]
name = "M34 setPolicy returns the stored capacity instead of the new one"
file = "src/lib/LibLeakyBucket.sol"
target = "capacity: capacity, leakRate: leakRate"
replacement = "capacity: bucket.capacity, leakRate: leakRate"

[[mutants]]
name = "M35 setPolicy does not check the stored level or the timestamps"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkLevelAndTimestamps(bucket, timestamp);
        Float level"""
replacement = """        Float level"""

[[mutants]]
name = "M36 setPolicy checks the stored policy, so a stored negative one is never replaced"
file = "src/lib/LibLeakyBucket.sol"
target = """        checkLevelAndTimestamps(bucket, timestamp);
        Float level"""
replacement = """        checkFillableDomain(bucket, timestamp);
        Float level"""

# --- a leak no `Float` holds ---

[[mutants]]
name = "M37 a leak at or above the level is subtracted instead of draining the bucket"
file = "src/lib/LibLeakyBucket.sol"
target = "if (LibDecimalFloatImplementation.gte(leakCoefficient, leakExponent, levelCoefficient, levelExponent)) {"
replacement = "if (false) {"

[[mutants]]
name = "M38 the leak is packed before it is compared, so one no Float holds reverts"
file = "src/lib/LibLeakyBucket.sol"
target = "(int256 levelCoefficient, int256 levelExponent) = bucket.level.unpack();"
replacement = """LibDecimalFloat.packArithmeticResult(leakCoefficient, leakExponent);
        (int256 levelCoefficient, int256 levelExponent) = bucket.level.unpack();"""

# --- the checkpoint at each write. M15 and M25 break the helper; each mutant
# here has one write go round it. ---

[[mutants]]
name = "M39 settle at a backwards clock moves the checkpoint back"
file = "src/lib/LibLeakyBucket.sol"
target = "return (leakedLevel(bucket, timestamp), checkpointAt(bucket, timestamp));"
replacement = "return (leakedLevel(bucket, timestamp), timestamp);"

[[mutants]]
name = "M40 fill at a backwards clock moves the checkpoint back"
file = "src/lib/LibLeakyBucket.sol"
target = "checkpoint = checkpointAt(bucket, timestamp);"
replacement = "checkpoint = timestamp;"

[[mutants]]
name = "M41 setPolicy at a backwards clock moves the checkpoint back"
file = "src/lib/LibLeakyBucket.sol"
target = "level: level, timestamp: checkpointAt(bucket, timestamp), capacity"
replacement = "level: level, timestamp: timestamp, capacity"

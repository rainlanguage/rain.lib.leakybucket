[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
# The library itself uses no EVM-version-specific opcodes; it is plain 256 bit
# arithmetic and shifts. A concrete embedding it is free to target an older EVM
# version. `cancun` here only matches the toolchain the tests run under.
evm_version = "cancun"

libs = ["dependencies"]

fuzz.runs = 4096

[dependencies]
forge-std = "1.16.2"
# `LibSaturatingMath` provides the saturating multiply and subtract the leak is
# built from. Audited (Protofire, January 2026) and DCL licensed, so the
# trickiest arithmetic in this library is an already reviewed primitive rather
# than a hand rolled overflow guard.
"rain-math-saturating" = "0.1.10"

[soldeer]
recursive_deps = false

[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
# The library itself uses no EVM-version-specific opcodes; it is plain 256 bit
# arithmetic and shifts. A concrete embedding it is free to target an older EVM
# version. `cancun` here only matches the toolchain the tests run under.
evm_version = "cancun"

libs = ["dependencies"]

fuzz.runs = 4096

[dependencies]
forge-std = "1.16.2"
# `LibSaturatingMath` provides the saturating multiply and subtract the leak is
# built from. Audited (Protofire, January 2026) and DCL licensed, so the
# trickiest arithmetic in this library is an already reviewed primitive rather
# than a hand rolled overflow guard.
"rain-math-saturating" = "0.1.10"

[soldeer]
recursive_deps = false

# The shipped library floats `^0.8.25`, which promises every consumer that it
# compiles on any 0.8.x at or above that. The default profile only ever proves
# the bottom of that range: `solc = "0.8.25"`. This profile proves the top.
#
# It builds `src/` alone, because it has to. Eight of the repo's thirteen
# Solidity files pin `=0.8.25` — every test and harness, correctly, since a
# concrete contract pins — so a suite run at any other version fails before it
# starts on "No solc version exists that matches the version requirement". Only
# the five floating files can be asked this question at all, and `skip` is what
# asks it.
#
# This is a compile check, not a behaviour check: it proves the promise the
# caret makes (that it builds), not that it behaves identically on 0.8.26+.
[profile.solc-range]
skip = ["test/**"]
solc = "0.8.30"

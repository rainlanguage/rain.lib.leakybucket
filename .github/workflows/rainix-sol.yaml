name: rainix-sol
# A fork's push event fires in the fork, not here, so `pull_request` is what
# gives an external PR any checks at all. `push` stays branch-scoped to main so
# a same-repo PR branch runs this once rather than twice.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rainix-sol:
    uses: rainlanguage/rainix/.github/workflows/rainix-sol.yaml@main
    secrets: inherit
